<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Status Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16191d;--mute:#5d6672;--line:#e1e5ea;--ok:#157347;--warn:#b26a00;--bad:#b3261e;--accent:#1a56db;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#181c22;--ink:#e8ebef;--mute:#98a2ae;--line:#2a3039;--ok:#4cc38a;--warn:#e0a03a;--bad:#f2766d;--accent:#7aa2ff;--chip:#222831}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{padding:20px 16px 8px;max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
h1{font-size:22px;margin:0}
.sub{color:var(--mute);font-size:13px}
main{max-width:1200px;margin:0 auto;padding:8px 16px 48px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:12px 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h2{font-size:16px;margin:0 0 2px}
.big{font-size:24px;font-weight:650;line-height:1.2}
.row{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.row div{min-width:64px}.row small{display:block;color:var(--mute);font-size:12px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--chip)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 12px}
nav button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:8px;cursor:pointer}
nav button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
h3{font-size:15px;margin:22px 0 8px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;background:var(--chip)}
tr:last-child td{border-bottom:0}
td.path{word-break:break-all;font:13px ui-monospace,Consolas,monospace}
a{color:var(--accent)}
.rbtn{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:5px 14px;border-radius:8px;cursor:pointer;margin-left:8px}
.rbtn:disabled{opacity:.6;cursor:wait}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;margin:6px 0}
summary{cursor:pointer;font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;font:13px/1.5 ui-monospace,Consolas,monospace;margin:8px 0 2px}
ul.items{margin:6px 0;padding-left:20px}ul.items li{margin:3px 0}
code{font:13px ui-monospace,Consolas,monospace;background:var(--chip);padding:1px 5px;border-radius:4px}
.empty{color:var(--mute);padding:18px;text-align:center;background:var(--card);border:1px dashed var(--line);border-radius:10px}
.tbl{overflow-x:auto}
</style>
</head>
<body>
<header>
  <h1>Project Status Dashboard</h1>
  <div class="sub" id="gen"></div>
</header>
<main>
  <div class="grid" id="cards"></div>
  <nav id="tabs"></nav>
  <section id="detail"></section>
</main>
<script>
window.addEventListener("error", (e) => {
  const d = document.querySelector("#detail") || document.body;
  d.insertAdjacentHTML("afterbegin", `<div class="empty bad">The dashboard hit an error: ${String(e.message).replace(/</g, "&lt;")} (line ${e.lineno}).</div>`);
});
const DATA = /*__DATA__*/null;
if (!DATA) throw new Error("This is the blank page-template.html, not the dashboard. Run refresh.cmd.");
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ago = (iso) => { if (!iso) return "never"; const h = (Date.now() - Date.parse(iso)) / 36e5; return h < 1 ? "just now" : h < 48 ? Math.round(h) + " h ago" : Math.round(h / 24) + " days ago"; };
const fmt = (iso) => iso ? new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : "-";
let tab = "overview";

$("#gen").innerHTML = `<span id="stamp"></span> <button id="refresh" class="rbtn">Refresh now</button>`;
$("#stamp").textContent = "Data pulled " + fmt(DATA.generatedAt) + " (" + ago(DATA.generatedAt) + ").";
$("#refresh").onclick = async (e) => {
  const b = e.target;
  if (location.protocol !== "http:") { $("#stamp").textContent = "Refresh needs the local server. Start the dashboard with refresh.cmd."; return; }
  b.disabled = true; b.textContent = "Refreshing...";
  try { const r = await fetch("/refresh", { method: "POST" }); if (!r.ok) throw new Error(await r.text()); location.reload(); }
  catch (err) { b.disabled = false; b.textContent = "Refresh now"; $("#stamp").textContent = "Refresh failed: " + err.message; }
};

// Outstanding = open GitHub issues + open PRs + the newest "still open" list from PROJECT_STATUS.md.
const counts = (p) => ({
  uncommitted: p.git?.files.length ?? 0,
  unpushed: p.git?.unpushed.length ?? 0,
  issues: p.remote.issues.length,
  prs: p.remote.prs.length,
  todo: p.doc?.totalOpen ?? 0,
});
function status(p) {
  if (p.error) return ["Git error", "bad"];
  const c = counts(p);
  if (c.uncommitted || c.unpushed) return ["Needs commit", "warn"];
  if (p.git.behind) return ["Behind remote", "warn"];
  if (c.issues || c.prs) return ["Open items", "warn"];
  return ["Clean", "ok"];
}

function cards() {
  $("#cards").innerHTML = DATA.projects.map((p) => {
    const [label, cls] = status(p), c = counts(p);
    return `<div class="card"><h2>${esc(p.key)}</h2><div class="sub">${esc(p.name)}</div>
      <div class="big ${cls}">${label}</div>
      <div class="sub">${p.git ? esc(p.git.branch) + " · last commit " + ago(p.git.last.date) : esc(p.error)}</div>
      <div class="row"><div><b class="${c.uncommitted ? "warn" : ""}">${c.uncommitted}</b><small>To commit</small></div><div><b class="${c.unpushed ? "warn" : ""}">${c.unpushed}</b><small>To push</small></div><div><b class="${c.issues ? "warn" : ""}">${c.issues}</b><small>Issues</small></div><div><b>${c.prs}</b><small>Open PRs</small></div></div>
    </div>`;
  }).join("");
}

function tabs() {
  const items = [["overview", "Overview"], ...DATA.projects.map((p) => [p.key, p.key])];
  $("#tabs").innerHTML = items.map(([k, n]) => `<button aria-pressed="${tab === k}" data-k="${k}">${esc(n)}</button>`).join("");
  $("#tabs").onclick = (e) => { const k = e.target.dataset.k; if (k) { tab = k; tabs(); render(); } };
}

function overview() {
  const commit = DATA.projects.filter((p) => p.git && (p.git.files.length || p.git.unpushed.length));
  const issues = DATA.projects.flatMap((p) => [...p.remote.issues.map((i) => ({ p, t: "Issue", ...i })), ...p.remote.prs.map((i) => ({ p, t: i.isDraft ? "Draft PR" : "PR", ...i }))]);
  return `<h3>Items to commit</h3>` + (commit.length ? `<div class="tbl"><table><tr><th>Project</th><th>Branch</th><th>Uncommitted files</th><th>Unpushed commits</th></tr>
    ${commit.map((p) => `<tr><td>${esc(p.key)}</td><td>${esc(p.git.branch)}</td><td>${p.git.files.length}</td><td>${p.git.unpushed.length}</td></tr>`).join("")}</table></div>` : `<div class="empty">Everything is committed and pushed.</div>`) +
    `<h3>Open issues and pull requests</h3>` + (issues.length ? `<div class="tbl"><table><tr><th>Project</th><th>Type</th><th>Title</th><th>Updated</th></tr>
    ${issues.map((i) => `<tr><td>${esc(i.p.key)}</td><td>${i.t}</td><td><a href="${esc(i.url)}" target="_blank" rel="noopener">#${i.number} ${esc(i.title)}</a></td><td>${ago(i.updatedAt)}</td></tr>`).join("")}</table></div>` : `<div class="empty">No open issues or pull requests.</div>`);
}

function projectView(p) {
  if (p.error) return `<div class="empty bad">${esc(p.error)}</div>`;
  const g = p.git, r = p.remote;
  const sync = !g.upstream ? "No upstream branch" : `${g.ahead} ahead / ${g.behind} behind ${esc(g.upstream)}`;
  return `<div class="sub"><code>${esc(p.dir)}</code> · <a href="${r.url}" target="_blank" rel="noopener">GitHub</a> · ${sync}${g.stashes ? " · " + g.stashes + " stash(es)" : ""}</div>
  <div class="sub">Last commit <code>${esc(g.last.hash)}</code> ${esc(g.last.subject)} (${ago(g.last.date)})</div>
  <h3>Items to commit (${g.files.length})</h3>
  ${g.files.length ? `<div class="tbl"><table><tr><th>State</th><th>Path</th></tr>${g.files.map((f) => `<tr><td><span class="pill ${f.kind === "conflict" ? "bad" : "warn"}">${f.kind}</span></td><td class="path">${esc(f.path)}</td></tr>`).join("")}</table></div>` : `<div class="empty">Working tree is clean.</div>`}
  ${g.unpushed.length ? `<h3>Commits not pushed (${g.unpushed.length})</h3><ul class="items">${g.unpushed.map((c) => `<li><code>${esc(c.slice(0, 7))}</code> ${esc(c.slice(8))}</li>`).join("")}</ul>` : ""}
  <h3>Outstanding issues</h3>
  ${r.issues.map((i) => `<details><summary><a href="${esc(i.url)}" target="_blank" rel="noopener">#${i.number}</a> ${esc(i.title)} <span class="sub">· ${ago(i.updatedAt)}</span></summary><pre>${esc(i.body)}</pre></details>`).join("") || `<div class="empty">No open issues.</div>`}
  ${r.prs.length ? `<h3>Open pull requests</h3><ul class="items">${r.prs.map((x) => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">#${x.number}</a> ${esc(x.title)}${x.isDraft ? " (draft)" : ""}</li>`).join("")}</ul>` : ""}
  <h3>Status notes (PROJECT_STATUS.md)</h3>
  ${p.doc ? `<div class="sub">${esc(p.doc.headline)}</div>${p.doc.open.length ? `<ul class="items">${p.doc.open.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>${p.doc.totalOpen > p.doc.open.length ? `<div class="sub">Showing ${p.doc.open.length} of ${p.doc.totalOpen}. See PROJECT_STATUS.md.</div>` : ""}` : `<div class="empty">No "still open" list in the newest entry.</div>`}` : `<div class="empty">No PROJECT_STATUS.md found.</div>`}`;
}

function render() {
  const p = DATA.projects.find((x) => x.key === tab);
  $("#detail").innerHTML = p ? projectView(p) : overview();
}
cards(); tabs(); render();
</script>
</body>
</html>
